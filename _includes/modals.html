 <!-- Portfolio Modals -->
 {% for post in site.posts %}
    <div class="portfolio-modal modal fade" id="portfolioModal{{ post.modal-id }}" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-content">
            <div class="close-modal" data-dismiss="modal">
                <div class="lr">
                    <div class="rl">
                    </div>
                </div>
            </div>
            <div class="container">
                <div class="row">
                    <div class="col-lg-8 col-lg-offset-2">
                        <div class="modal-body">
                            <h2>{{ post.title }}</h2>
                            <ul class="list-inline  item-details">
                                <li><img
                                        src="img/logos/{{ post.logo-1 }}"
                                        class="img-tumbnail"
                                        style="max-width: 150px; max-height: 150px; border: 0px;"
                                        alt="{{ post.alt }}">
                                </li>
                                <li><img
                                        src="img/logos/{{ post.logo-2 }}"
                                        class="img-tumbnail"
                                        style="max-width: 150px; max-height: 150px; border: 0px;"
                                        alt="{{ post.alt }}">
                                </li>
                                <li><img
                                        src="img/logos/{{ post.logo-3 }}"
                                        class="img-tumbnail"
                                        style="max-width: 150px; max-height: 150px; border: 0px;"
                                        alt="{{ post.alt }}">
                                </li>
                            </ul>
                            <img src="img/portfolio/{{ post.img }}" class="img-responsive img-centered" alt="{{ post.alt }}">
                            <div class="modal-content">
                            {{ post.content }}
                            </div>
                            <button type="button" class="btn btn-default" data-dismiss="modal"><i class="fa fa-times"></i> Close</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
